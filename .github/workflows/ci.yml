name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests and demo (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the tests (with coverage, skip reasons shown)
        run: pytest -q -rs --cov=leakscope --cov-report=term

      - name: One-command demo on synthetic data
        run: python -m leakscope demo

      - name: Audit must agree with the labelled scenarios (exits 1 otherwise)
        run: python -m leakscope audit --config demo_work/demo.yaml --no-explain

      - name: Keep the demo results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: demo-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: demo_results/
          if-no-files-found: ignore