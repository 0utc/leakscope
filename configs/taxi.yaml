data:
  raw_parquet: data/raw/yellow_tripdata_2024-01.parquet
  zone_lookup: data/raw/taxi_zone_lookup.csv
  database: data/processed/leakscope.duckdb
  temp_dir: tmp

window:
  start: "2024-01-01"
  end: "2024-02-01"      # exclusive

cleaning:
  min_duration_min: 1.0
  max_duration_min: 180.0

duckdb:
  memory_limit: 1GB
  threads: 2

availability:            # SIMULATED lags: assumptions, not observed facts
  pickup_fields_lag_min: 0
  dropoff_fields_lag_min: 0
  distance_lag_min: 0
  fare_lag_min: 2
  fare_correction_next_day_hour: 6

sampling:
  n_examples: 100000
  seed: 42
  warmup_days: 7
  

ml:
  test_start: "2024-01-25"      # test = last 7 days (a full weekly cycle)
  seed: 0
  model:                        # HistGradientBoostingRegressor
    max_iter: 200
    learning_rate: 0.1
    max_leaf_nodes: 31
 

analysis:
  n_boot: 2000                  # bootstrap resamples
  seed: 0