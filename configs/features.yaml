features:
  # ---------- Valid features (negative controls) ----------
  - name: pickup_hour
    kind: row
    scenario: N1
    source: "prediction_examples.t_pred"
    transformation: "hour(t_pred)"
    event_time: event_pickup
    availability_time: avail_pickup
    declared_post_outcome: false

  - name: pickup_dow
    kind: row
    scenario: N1
    source: "prediction_examples.t_pred"
    transformation: "dayofweek(t_pred)"
    event_time: event_pickup
    availability_time: avail_pickup
    declared_post_outcome: false

  - name: pu_zone
    kind: row
    scenario: N1
    source: "clean_trips.PULocationID"
    transformation: "identity"
    event_time: event_pickup
    availability_time: avail_pickup
    declared_post_outcome: false

  - name: passenger_count_filled
    kind: row
    scenario: N1
    source: "clean_trips.passenger_count"
    transformation: "coalesce(passenger_count, 1)  [constant fill, no fitted statistics]"
    event_time: event_pickup
    availability_time: avail_pickup
    declared_post_outcome: false

  - name: passenger_missing
    kind: row
    scenario: N1
    source: "clean_trips.passenger_count"
    transformation: "passenger_count IS NULL"
    event_time: event_pickup
    availability_time: avail_pickup
    declared_post_outcome: false

  - name: zone_avg_dur_asof
    kind: aggregate
    scenario: N2
    source: "zone_cum"
    transformation: "mean duration_min of same-zone trips with avail_dropoff <= t_pred"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: false
    group_by: pu_zone
    window: up_to_t_pred
    includes_current_row: false

  - name: zone_avg_dur_7d
    kind: aggregate
    scenario: N3
    source: "zone_cum"
    transformation: "mean duration_min of same-zone trips with avail_dropoff in (t_pred - 7d, t_pred]"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: false
    group_by: pu_zone
    window: lookback
    lookback_days: 7
    includes_current_row: false

  # ---------- Intentionally leaky features ----------
  - name: leak_trip_distance
    kind: row
    scenario: L1
    source: "clean_trips.trip_distance"
    transformation: "identity"
    event_time: event_pickup             # WRONG ON PURPOSE: metadata claims it was recorded at pickup
    availability_time: avail_pickup      # WRONG ON PURPOSE: optimistic metadata
    declared_post_outcome: true

  - name: leak_total_amount
    kind: row
    scenario: L2
    source: "clean_trips.total_amount"
    transformation: "identity"
    event_time: event_dropoff
    availability_time: avail_fare
    declared_post_outcome: false

  - name: leak_dropoff_hour
    kind: row
    scenario: L3
    source: "clean_trips.tpep_dropoff_datetime"
    transformation: "hour(dropoff time)"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: true

  - name: leak_zone_avg_global
    kind: aggregate
    scenario: L4
    source: "zone_global"
    transformation: "mean duration_min of ALL clean trips in the same zone"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: false
    group_by: pu_zone
    window: whole_dataset
    includes_current_row: true


  - name: zone_avg_dur_60m
    kind: aggregate
    scenario: N5
    source: "zone_cum"
    transformation: "mean duration_min of same-zone trips with avail_dropoff in (t_pred - 60 min, t_pred]"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: false
    group_by: pu_zone
    window: lookback
    lookback_minutes: 60
    window_clock: avail_dropoff
    includes_current_row: false

  - name: leak_zone_avg_60m_self
    kind: aggregate
    scenario: L5
    source: "zone_cum + the example's own trip"
    transformation: "60-minute availability-based zone average PLUS the example's own duration"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: false
    group_by: pu_zone
    window: lookback
    lookback_minutes: 60
    window_clock: avail_dropoff
    includes_current_row: true

  - name: leak_zone_avg_60m_inprogress
    kind: aggregate
    scenario: L6
    source: "zone_cum_pickup"
    transformation: "mean duration of same-zone trips PICKED UP in (t_pred - 60 min, t_pred], including trips still in progress"
    event_time: event_dropoff
    availability_time: avail_dropoff
    declared_post_outcome: false
    group_by: pu_zone
    window: lookback
    lookback_minutes: 60
    window_clock: event_pickup
    includes_current_row: false

  - name: leak_fare_correction
    kind: row
    scenario: L7
    source: "clean_trips.fare_amount"
    transformation: "identity (simulated next-day corrected fare of the trip itself)"
    event_time: event_dropoff
    availability_time: avail_fare_correction
    declared_post_outcome: false

  - name: leak_snapshot_zone_avg
    kind: row
    scenario: L8
    source: "zone_cum snapshot taken at the end of the pickup day"
    transformation: "zone average duration as of the end of the prediction day (joined on date, not on time)"
    event_time: event_snapshot_eod
    availability_time: avail_snapshot_eod
    declared_post_outcome: false

  - name: leak_last_fare_zone
    kind: row
    scenario: L9
    source: "clean_trips.total_amount of the last completed trip in the zone"
    transformation: "latest same-zone trip with event_dropoff <= t_pred (should have used avail_fare)"
    event_time: event_dropoff
    availability_time: avail_fare
    declared_post_outcome: false
    source_record: lookup