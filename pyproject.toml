[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leakscope"
version = "0.1.0"
description = "Temporal data leakage auditor for ML pipelines"
requires-python = ">=3.11"
dependencies = [
    "duckdb", "polars", "pyarrow", "scikit-learn", "pandas",
    "pandera", "typer", "matplotlib", "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
leakscope = "leakscope.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]